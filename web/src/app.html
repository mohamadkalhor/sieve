<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Weighted model selection for agent fleets" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <!--
      No webfont link here any more (CONSOLE.md section 3.2).

      IBM Plex Sans and IBM Plex Mono are self-hosted through
      `@fontsource/*`, imported at the top of `app.css`, so no request leaves
      this origin for a font. The Google Fonts stylesheet that lived here was
      render-blocking, and on a machine that could not reach it the page stayed
      blank until the request timed out.
    -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
