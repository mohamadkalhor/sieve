[project]
name = "sieve"
version = "0.1.0.dev0"
description = "Weighted model selection for agent fleets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "mcp>=1.2",
]


[project.scripts]
sieve = "sieve.cli:main"

[project.entry-points."sieve.sources"]
aa_llm = "sieve.sources.aa_llm:AALLMSource"
aa_media = "sieve.sources.aa_media:AAMediaSource"
openrouter = "sieve.sources.openrouter:OpenRouterSource"
fal = "sieve.sources.fal:FalSource"
manual = "sieve.sources.manual:ManualSource"

[project.entry-points."sieve.inventories"]
openai_compat = "sieve.inventory.openai_compat:OpenAICompatInventory"
list = "sieve.inventory.static_list:StaticListInventory"

[project.entry-points."sieve.targets"]
file = "sieve.targets.file:FileTarget"
http = "sieve.targets.http:HttpTarget"
webhook = "sieve.targets.webhook:WebhookTarget"
ninerouter = "sieve.targets.ninerouter:NineRouterTarget"
litellm = "sieve.targets.litellm:LiteLLMTarget"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sieve"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is documentation, not source. ruff formats the python blocks
# inside a .md file, which unaligns the trailing comments CONTRACTS.md
# is readable because of.
exclude = ["web", ".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["^web/", "^\\.venv/"]
# What `mypy` with no argument checks, so the command is the same here and
# in CI.
files = ["sieve", "tests"]

[[tool.mypy.overrides]]
module = ["mcp.*", "ruamel.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
