# `price:per_task` is derived by the engine from the published price and the
# profile's shape. Every one of the nine models on this board carries a price,
# which is unusual for media and is the reason the modality is rankable at all.

name: cost
modality: video-editing
label: "Cost"
describes: "what one task costs at this profile's shape (per second of video)"
fields:
  - {source: price, field: per_task, weight: 1.0, transform: neg_log}
missing: renormalise
min_coverage: 0.5
higher_is_better: true
