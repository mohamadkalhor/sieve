# `price:per_task` is derived by the engine from the published price and a
# fixed shape per modality (`sieve.engine.SHAPES`): a rate cannot be ranked
# against a benchmark score until something says how much of it one task uses. neg_log: the gap from $0.10 to $1.00
# matters far more than the gap from $10 to $11.

name: cost
modality: llm
label: "Cost"
describes: "what one task of this kind costs to run"
fields:
  - {source: price, field: per_task, weight: 1.0, transform: neg_log}
missing: renormalise
min_coverage: 0.5
higher_is_better: true
