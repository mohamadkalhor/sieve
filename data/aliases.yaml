# Alias file: canonical id -> the ids a source or a gateway uses for it.
#
# A hand-written alias beats every rule in sieve/catalog/match.py, which is the
# point: this is how you fix a match Sieve got wrong, or one it would not guess
# at. Sieve never guesses below 0.8 confidence -- a wrong match silently routes
# traffic to a different model, which is far worse than an unmatched id you can
# see on the Sources screen and fix here.
#
# You do NOT need an entry for the shapes the matcher already handles:
#   a vendor prefix a gateway invented      oc-go/glm-5.3   -> z-ai/glm-5.3
#   a dot or a dash in a version            claude-opus-4.6 == claude-opus-4-6
#   case and punctuation                    GPT-5.2, Claude_Sonnet_5
#   a date stamp, :free, :nitro, -preview   claude-opus-5-20260420
#
# What needs an entry is a name that shares no shape with the canonical id: a
# vanity alias, an internal deployment name, or a rename.
#
# Keep it sorted. Comment anything ambiguous, because the next person cannot
# tell a deliberate alias from a typo.

# --- short names people actually type -------------------------------------
anthropic/claude-opus-5:
  - opus
  - opus-5
anthropic/claude-sonnet-5:
  - sonnet
  - sonnet-5
anthropic/claude-haiku-4-5:
  - haiku

# --- a source's own slug where it diverges from the gateway's -------------
# Artificial Analysis writes versions with dashes and OpenRouter with dots.
# The matcher folds those together on its own; these are here only where the
# creator prefix also differs, which it cannot resolve.
z-ai/glm-5.3:
  - zhipu/glm-5.3
  - zhipuai/glm-5-3

# --- deployments named after a role rather than a model -------------------
# Uncomment and edit for your own gateway. These are the ids that show up as
# unmatched on the Sources screen, because nothing about the name says which
# model is behind it.
#
# anthropic/claude-opus-5:
#   - internal/reasoning-large
# openai/gpt-5-2:
#   - internal/chat-default
