# Alias file: canonical id -> the ids a source or a gateway uses for it.
#
# A hand-written alias beats every rule in sieve/catalog/match.py, which is the
# point: this is how you fix a match Sieve got wrong, or one it would not guess
# at. Sieve never guesses below 0.8 confidence -- a wrong match silently routes
# traffic to a different model, which is far worse than an unmatched id you can
# see on the Sources screen and fix here.
#
# You do NOT need an entry for the shapes the matcher already handles:
#   a vendor prefix a gateway invented      oc-go/glm-5.3   -> z-ai/glm-5.3
#   a dot or a dash in a version            claude-opus-4.6 == claude-opus-4-6
#   case and punctuation                    GPT-5.2, Claude_Sonnet_5
#   a date stamp, :free, :nitro, -preview   claude-opus-5-20260420
#
# What needs an entry is a name that shares no shape with the canonical id: a
# vanity alias, an internal deployment name, or a rename.
#
# Keep it sorted. Comment anything ambiguous, because the next person cannot
# tell a deliberate alias from a typo.

# --- short names people actually type -------------------------------------
anthropic/claude-opus-5:
  - opus
  - opus-5
anthropic/claude-sonnet-5:
  - sonnet
  - sonnet-5
anthropic/claude-haiku-4-5:
  - haiku

# --- a source's own slug where it diverges from the gateway's -------------
# Artificial Analysis writes versions with dashes and OpenRouter with dots.
# The matcher folds those together on its own; these are here only where the
# creator prefix also differs, which it cannot resolve.
#
# Checked on 2026-09-08 by running every OpenRouter id in the recordings
# through the matcher against every Artificial Analysis id. Of 60 ids: 1 exact,
# 13 resolved by a rule, and the remaining 46 are models one catalogue carries
# and the other does not -- not misses. So this file stays short on purpose.
# The one gap the pass found was `:batch`, which is now a tag rule in
# sieve/catalog/match.py rather than 12 entries here.
#
# The creator split below is real and observed: AA writes `zai`, OpenRouter
# writes `z-ai`. The matcher happens to fold it at 0.9, and these entries make
# it exact and survive a change to the normaliser.
z-ai/glm-5.3:
  - zai/glm-5-3
  - zhipu/glm-5.3
  - zhipuai/glm-5-3
z-ai/glm-5.3-flash:
  - zai/glm-5-3-flash

# --- deployments named after a role rather than a model -------------------
# Uncomment and edit for your own gateway. These are the ids that show up as
# unmatched on the Sources screen, because nothing about the name says which
# model is behind it.
#
# anthropic/claude-opus-5:
#   - internal/reasoning-large
# openai/gpt-5-2:
#   - internal/chat-default

# --- fal ids against Artificial Analysis ids -------------------------------
# AA measures media quality and publishes no media price; fal publishes media
# prices and measures no quality. Joining them is the only way a media model
# gets both, and the two catalogues name the same model under different vendor
# prefixes: fal writes the serving vendor, AA writes the creator.
#
# Every pair below was checked on 2026-09-08 and is slug-identical after
# normalisation -- `wan-3.0` and `wan-3-0`, `veo3.1` and `veo-3-1`. The matcher
# scores those 0.85 on the slug rule, and `merge_pull` refuses anything under
# 0.9 because a wrong merge fuses two models. Writing them here is the sanctioned
# way to say "this one is checked", rather than lowering that floor for
# everything.
#
# Do NOT add near-misses here. `nano-banana` and `nano-banana-2`, `gpt-image-1.5`
# and `gpt-image-2` look close and are different models; fusing them would be the
# exact failure the 0.9 floor exists to prevent.
alibaba/wan-3-0:
  - alibaba/wan-3.0
alibaba/wan-2-5-preview:
  - fal-ai/wan-25-preview
bytedance-seed/seedance-2-0:
  - bytedance/seedance-2.0
google/nano-banana-2:
  - fal-ai/nano-banana-2
google/veo-3-1:
  - fal-ai/veo3.1
microsoft-ai/mai-image-2-5:
  - microsoft/mai-image-2.5
microsoft-ai/mai-image-2-5-pro:
  - microsoft/mai-image-2.5-pro
resemble-ai/chatterbox-hd:
  - resemble-ai/chatterboxhd
spacexai/grok-imagine-image:
  - xai/grok-imagine-image
spacexai/grok-imagine-video:
  - xai/grok-imagine-video
