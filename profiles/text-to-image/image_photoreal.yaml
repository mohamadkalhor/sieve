# The source publishes no photorealism category for text-to-image today, so
# `nature` stands in for it -- it is the published category most sensitive to
# a picture looking real. Swap it the day a better one appears.

name: image_photoreal
modality: text-to-image
purpose: "photographic images that must not look generated"
weights:
  quality: 0.4
  nature: 0.4
  maturity: 0.2
require:
  min_appearances: 500
shape: {images: 1}
policy:
  margin: 15.0
  max_tenure_days: 30
  chain: 3
  min_confidence: 0.5
