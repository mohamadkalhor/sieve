name: reader
modality: llm
purpose: "summarising and answering over a large input"
weights:
  long_context: 0.45
  cost: 0.35
  speed: 0.2
require:
  min_axis: {long_context: 0.6}
  context_min: 200000
shape: {in: 200000, out: 1500, cached: 0.5}
policy:
  margin: 4.0
  chain: 5
  auto_apply: true

# Seat the *lowest* effort mode of a family that still clears the floor
# below. The floor is what makes this safe: without one, cheapest_clearing
# would always seat the bottom of the ladder.
prefer_effort: cheapest_clearing
