name: quick_chat
modality: llm
purpose: "short interactive turns where waiting is the worst outcome"
weights:
  intelligence: 0.35
  cost: 0.3
  latency: 0.25
  instruction: 0.1
require:
  min_axis: {intelligence: 0.55}

shape: {in: 1500, out: 400}
policy:
  margin: 3.0
  chain: 5

# Seat the *lowest* effort mode of a family that still clears the floor
# below. The floor is what makes this safe: without one, cheapest_clearing
# would always seat the bottom of the ladder.
prefer_effort: cheapest_clearing
