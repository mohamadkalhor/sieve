name: vision
modality: llm
purpose: "reading images: screenshots, documents, photographs"
weights:
  intelligence: 0.5
  cost: 0.3
  latency: 0.2
require:
  min_axis: {intelligence: 0.6}
  input_modalities: [image]
shape: {in: 4000, out: 800}
policy:
  margin: 4.0
  chain: 4
  auto_apply: true

# Seat the *lowest* effort mode of a family that still clears the floor
# below. The floor is what makes this safe: without one, cheapest_clearing
# would always seat the bottom of the ladder.
prefer_effort: cheapest_clearing
